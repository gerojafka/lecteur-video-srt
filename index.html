<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecteur vidéo + sous-titres</title>
<meta name="description" content="Lecteur vidéo + sous-titres SRT pour s'entraîner à répéter des phrases (français, anglais, espagnol).">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lecteur SRT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --panel2:#20242d; --line:#2c313c;
    --text:#e8eaf0; --muted:#9aa1ad; --accent:#4f8cff; --accent-soft:rgba(79,140,255,.18);
    --a:#3ecf8e; --b:#ff8a4c; --region:rgba(255,181,71,.22); --cue:#5b6372; --warn:#ffcf7a;
    --sub2:#ffd98a;
    --tap:40px;
  }
  @media (pointer:coarse){ :root{ --tap:46px } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  button,select,input{font:inherit;color:inherit}
  button,label,select,.track{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
  svg.i{width:20px;height:20px;fill:currentColor;flex:none}

  .app{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;
    padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
            max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .main{display:flex;flex-direction:column;gap:12px;min-width:0}

  /* Barre du haut */
  .topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .topbar h1{font-size:17px;margin:0 6px 0 0;font-weight:650;white-space:nowrap}
  .topbar .spacer{flex:1}
  .status{font-size:13px;color:var(--muted);min-width:0;flex:1 1 160px;display:flex;flex-direction:column;gap:1px}
  .status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status .warn{color:var(--warn);white-space:normal}
  .status .title{color:var(--text);font-size:15px;font-weight:600;white-space:normal;line-height:1.3}
  /* Bouton « Sous-titres » qui clignote tant qu'aucun .srt n'est chargé */
  .btn.blink{animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{background:var(--accent);border-color:var(--accent);color:#fff}}
  @media (prefers-reduced-motion:reduce){ .btn.blink{animation:none;background:var(--accent);border-color:var(--accent);color:#fff} }
  #playlist,#library{max-width:min(420px,100%);min-height:var(--tap)}
  #library{font-weight:600}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}

  /* Boutons */
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 12px;
    min-height:var(--tap);min-width:var(--tap);cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:6px;white-space:nowrap;user-select:none;-webkit-user-select:none}
  @media (hover:hover){ .btn:hover:not(:disabled){border-color:var(--accent)} }
  .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:110px}
  .btn.on{background:var(--accent-soft);border-color:var(--accent)}
  .btn.icon{padding:0}
  .btn .k{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .btn.primary .k{color:#dfe8ff;border-color:rgba(255,255,255,.4)}
  .btn.ma{color:var(--a);font-weight:700} .btn.mb{color:var(--b);font-weight:700}
  @media (hover:none), (pointer:coarse){ .k{display:none!important} }

  /* Vidéo */
  .stage{position:relative;background:#000;border-radius:12px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;min-height:200px}
  .stage video{display:block;width:100%;max-height:66vh;max-height:66dvh;background:#000}
  .stage.empty video{display:none}
  .empty-msg{display:none;color:var(--muted);text-align:center;padding:48px 20px;line-height:1.7}
  .stage.empty .empty-msg{display:block}
  .stage.drag{outline:2px dashed var(--accent);outline-offset:-8px}
  .vbox{position:relative;width:100%}
  .stage.empty .vbox{display:none}
  .overlay-sub{position:absolute;left:3%;right:3%;bottom:4px;text-align:center;pointer-events:none;z-index:2;
    font-size:clamp(14px,2.3vw,28px);display:flex;flex-direction:column;align-items:center;gap:2px}
  .overlay-sub span{display:inline;background:rgba(0,0,0,.75);color:#fff;font-size:1em;
    line-height:1.5;padding:2px 10px;border-radius:4px;
    white-space:pre-line;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .overlay-sub span.sub2{color:var(--sub2);font-size:.85em}
  /* iPhone standard (écran étroit, ≈ 390 px) : sous-titres 20 % plus petits */
  @media (pointer:coarse) and (max-width:400px), (pointer:coarse) and (max-height:400px){
    .overlay-sub{font-size:calc(.8 * clamp(14px,2.3vw,28px))}
  }
  /* Bandeau qui cache le texte incrusté dans l'image */
  .mask{position:absolute;left:0;right:0;pointer-events:none;z-index:1;
    background:rgba(12,13,17,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .countdown{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;
    background:rgba(15,17,21,.92);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;width:min(300px,90%);display:none;text-align:center;pointer-events:none}
  .countdown.on{display:block}
  .countdown .lbl{font-size:14px;margin-bottom:8px}
  .countdown .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .countdown .bar i{display:block;height:100%;background:var(--accent);width:0}
  .countdown .skip{margin-top:6px;font-size:12px;color:var(--muted)}

  /* Barre de temps */
  .timeline{padding:16px 14px 8px}
  .track{position:relative;height:36px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
  @media (pointer:coarse){ .track{height:46px} }
  .track .rail{position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-7px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .track .buffered{position:absolute;left:0;top:0;bottom:0;background:#2f3542}
  .track .played{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
  .track .region{position:absolute;top:50%;height:24px;margin-top:-14px;background:var(--region);display:none;pointer-events:none;border-radius:3px}
  .track .region.on{display:block}
  .track .region.loop{background:rgba(255,181,71,.36)}
  .track canvas{position:absolute;left:0;right:0;top:50%;margin-top:5px;width:100%;height:5px;pointer-events:none}
  .track .playhead{position:absolute;top:50%;width:2px;height:24px;margin:-14px 0 0 -1px;background:#fff;pointer-events:none;box-shadow:0 0 4px rgba(0,0,0,.6)}
  .marker{position:absolute;top:-6px;bottom:0;width:30px;margin-left:-15px;display:none;cursor:ew-resize;z-index:2}
  .marker.on{display:block}
  .marker::before{content:"";position:absolute;left:14px;top:12px;bottom:4px;width:2px;background:var(--c)}
  .marker span{position:absolute;top:0;left:50%;transform:translateX(-50%);
    background:var(--c);color:#111;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;line-height:15px}
  .marker.a{--c:var(--a)} .marker.b{--c:var(--b)}
  .marker.a span{left:auto;right:14px;transform:none;border-radius:4px 0 0 4px}
  .marker.b span{left:16px;transform:none;border-radius:0 4px 4px 0}
  .hover-tip{position:absolute;top:-20px;background:#000;color:#fff;font-size:12px;padding:1px 6px;
    border-radius:4px;transform:translateX(-50%);pointer-events:none;display:none;white-space:nowrap;z-index:3}
  .times{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}

  /* Contrôles */
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:0 14px 14px}
  .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ab-info{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  @media (max-width:700px){
    .controls{justify-content:center;padding:0 10px 12px}
    .grp{justify-content:center;gap:6px}
    .controls .lbl{display:none}
    .btn.primary{min-width:76px}
    .ab-info{width:100%;text-align:center}
    .topbar h1{display:none}
    .status{order:10;flex-basis:100%}
  }

  .current{padding:14px 18px;min-height:80px;font-size:clamp(18px,2vw,24px);line-height:1.45;white-space:pre-line}
  .current .ph{color:var(--muted);font-size:15px}
  .current .c2{display:block;color:var(--sub2);font-size:.82em;margin-top:4px}

  /* Panneau réglages (masqué par défaut) */
  .drawer{display:none;flex-direction:column;gap:12px;min-width:0}
  .app.open .drawer{display:flex}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .drawer-head h2{margin:0;font-size:16px}
  .backdrop{display:none}
  @media (min-width:1100px){
    .app.open{grid-template-columns:minmax(0,1fr) 380px}
    .drawer{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto}
  }
  @media (max-width:1099.98px){
    .drawer{display:flex;position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:30;
      background:var(--bg);border-left:1px solid var(--line);overflow:auto;-webkit-overflow-scrolling:touch;
      padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) 12px;
      transform:translateX(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
    .app.open .drawer{transform:none;visibility:visible;transition:transform .25s ease}
    .app.open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:29}
  }
  .opts{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .opts h3,.tr-head h3{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:32px}
  .row label,label.row{cursor:pointer}
  .row .grow{flex:1}
  .opts select{max-width:100%}
  input[type=range]{accent-color:var(--accent);flex:1;min-width:120px;min-height:28px}
  input[type=checkbox]{accent-color:var(--accent);width:20px;height:20px;flex:none}
  select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-height:34px}
  .val{font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
  .hint{color:var(--muted);font-size:12.5px}
  .switch{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}

  /* Transcription : seulement la phrase en cours */
  .transcript{display:flex;flex-direction:column}
  .tr-list li:not(.active):not(.tr-empty){display:none}
  .tr-list:not(:has(li.active)):not(:has(.tr-empty))::before{content:"…";display:block;padding:7px 12px;color:var(--muted)}
  .tr-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .tr-list{list-style:none;margin:0;padding:6px;overflow:auto;position:relative;flex:1;-webkit-overflow-scrolling:touch}
  .tr-list li{display:grid;grid-template-columns:48px 1fr auto;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;align-items:start}
  @media (hover:hover){ .tr-list li:hover{background:var(--panel2)} }
  .tr-list li.active{background:var(--accent-soft)}
  .tr-list li.inab .t{color:var(--warn)}
  .tr-list .t{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
  .tr-list .x{white-space:pre-line}
  .tr-list .x2{display:block;color:var(--sub2);font-size:.9em;margin-top:2px}
  .tr-list .mk{display:flex;gap:4px;opacity:0}
  .tr-list li:hover .mk,.tr-list li.active .mk{opacity:1}
  @media (hover:none){ .tr-list .mk{opacity:1} }
  .tr-list .mk button{background:transparent;border:1px solid var(--line);border-radius:6px;
    font-size:12px;font-weight:700;min-width:30px;min-height:28px;cursor:pointer}
  .tr-list .mk .ma{color:var(--a)} .tr-list .mk .mb{color:var(--b)}
  .tr-empty{color:var(--muted);padding:20px;text-align:center;display:block!important}
  .keys{padding:12px 16px;color:var(--muted);font-size:12.5px;line-height:1.8}
  .keys b{color:var(--text);font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11.5px}
  @media (hover:none), (pointer:coarse){ .keys{display:none} }

  /* Choix du profil (premier lancement) */
  .chooser{position:fixed;inset:0;z-index:50;background:rgba(8,9,12,.92);display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  .chooser[hidden]{display:none}
  .chooser-box{width:min(440px,100%);padding:20px;display:flex;flex-direction:column;gap:10px}
  .chooser-box h2{margin:0 0 6px;font-size:18px;text-align:center}
  .chooser-box .btn{justify-content:flex-start;white-space:normal;text-align:left;padding:10px 14px;font-size:16px}

  /* iPhone à l'horizontale : on donne la priorité à la vidéo */
  @media (orientation:landscape) and (max-height:500px){
    .stage video{max-height:calc(100dvh - 120px)}
    .topbar h1{display:none}
    .current{min-height:0;padding:10px 14px;font-size:18px}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>
  <symbol id="i-start" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M11 5v14L3 12zM21 5v14l-8-7z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M13 5v14l8-7zM3 5v14l8-7z"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></symbol>
  <symbol id="i-loop" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><path d="m18 4 2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4z"/></symbol>
  <symbol id="i-subs" viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM4 12h4v2H4zm10 6H4v-2h10zm6 0h-4v-2h4zm0-4H10v-2h10z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.14 12.94a7.1 7.1 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 13.93 2h-3.84a.48.48 0 0 0-.47.41l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.47a.48.48 0 0 0 .12.61l2.03 1.58a7.1 7.1 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></symbol>
</svg>

<div class="app" id="app">
  <section class="main">
    <div class="topbar">
      <h1 data-t="title">Lecteur vidéo + sous-titres</h1>
      <select id="library" hidden data-ta="libTitle" data-tt="libTitle">
        <option value="" data-t="libPh">📚 Bibliothèque…</option>
      </select>
      <label class="btn" data-tt="videoTitle">
        <svg class="i"><use href="#i-video"/></svg><span class="lbl" data-t="video">Vidéo</span>
        <input class="sr" type="file" id="fVideo" accept="video/*,.mp4,.m4v,.mov,.webm,.mkv" multiple>
      </label>
      <label class="btn" id="lblSrt" data-tt="subsTitle">
        <svg class="i"><use href="#i-subs"/></svg><span class="lbl" data-t="subs">Sous-titres</span>
        <input class="sr" type="file" id="fSrt">
      </label>
      <select id="playlist" hidden aria-label="Vidéo"></select>
      <div class="status" id="status"></div>
      <span class="spacer"></span>
      <button class="btn icon" id="bSettings" data-ta="settings" data-tt="settingsKey">
        <svg class="i"><use href="#i-gear"/></svg>
      </button>
    </div>

    <div class="stage empty" id="stage">
      <div class="vbox" id="vbox">
        <video id="video" playsinline webkit-playsinline preload="auto"></video>
        <div class="mask" id="mask" hidden></div>
        <div class="overlay-sub" id="overlay"></div>
      </div>
      <div class="empty-msg" id="emptyMsg"></div>
      <div class="countdown" id="countdown">
        <div class="lbl" id="cdLabel"></div>
        <div class="bar"><i id="cdBar"></i></div>
        <div class="skip" data-t="skip">▶</div>
      </div>
    </div>

    <div class="panel">
      <div class="timeline">
        <div class="track" id="track">
          <div class="rail"><div class="buffered" id="buffered"></div><div class="played" id="played"></div></div>
          <canvas id="cueCanvas"></canvas>
          <div class="region" id="region"></div>
          <div class="playhead" id="playhead"></div>
          <div class="marker a" id="mA" data-m="A" data-tt="markerA"><span>A</span></div>
          <div class="marker b" id="mB" data-m="B" data-tt="markerB"><span>B</span></div>
          <div class="hover-tip" id="tip"></div>
        </div>
        <div class="times"><span id="tCur">0:00.0</span><span id="tDur">0:00.0</span></div>
      </div>
      <div class="controls">
        <div class="grp">
          <button class="btn" id="bStart" data-tt="startTitle"><svg class="i"><use href="#i-start"/></svg><span class="lbl" data-t="start">Début</span></button>
          <button class="btn" id="bPrev" data-tt="prevTitle"><svg class="i"><use href="#i-prev"/></svg></button>
          <button class="btn primary" id="bPlay"><svg class="i"><use id="playIcon" href="#i-play"/></svg><span class="lbl" id="playLbl"></span><span class="k" data-t="spaceKey">Espace</span></button>
          <button class="btn" id="bNext" data-tt="nextTitle"><svg class="i"><use href="#i-next"/></svg></button>
          <button class="btn" id="bReplay" data-tt="replayTitle"><svg class="i"><use href="#i-replay"/></svg><span class="lbl" data-t="phrase">Phrase</span></button>
        </div>
        <div class="grp">
          <button class="btn ma" id="bA" data-tt="aTitle">[ A</button>
          <button class="btn mb" id="bB" data-tt="bTitle">B ]</button>
          <button class="btn" id="bLoop" data-tt="loopTitle"><svg class="i"><use href="#i-loop"/></svg><span class="lbl" data-t="loop">Boucle A-B</span></button>
          <button class="btn" id="bClear" data-tt="clearTitle"><svg class="i"><use href="#i-close"/></svg></button>
        </div>
        <span class="ab-info" id="abInfo"></span>
      </div>
    </div>

    <div class="panel current" id="current"></div>
  </section>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" data-ta="settings">
    <div class="drawer-head">
      <h2 data-t="settings">Réglages</h2>
      <button class="btn icon" id="bClose" data-ta="close"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="panel opts">
      <h3 data-t="profile">Profil</h3>
      <select id="oProfile" aria-label="Profil"></select>

      errFiles: 'No video or subtitle file recognised in the selection.', errRead: 'No readable subtitles in {name}',

    },
    es: {
      title: 'Reproductor de vídeo + subtítulos', libPh: '📚 Biblioteca…', libTitle: 'Vídeos de la biblioteca',
      video: 'Vídeo', videoTitle: 'Elegir el vídeo', subs: 'Subtítulos', subsTitle: 'Elegir el archivo de subtítulos (.srt)',
      settings: 'Ajustes', settingsKey: 'Ajustes (S)', close: 'Cerrar', profile: 'Perfil',
      emptyFiles: 'Elija el vídeo con <b>Vídeo</b> y luego el archivo .srt con <b>Subtítulos</b>.<br>En el ordenador también puede arrastrar los dos archivos aquí.',
      emptyLib: 'Elija un vídeo en la lista <b>📚 Biblioteca</b>,<br>o abra sus propios archivos con <b>Vídeo</b> y <b>Subtítulos</b>.',
      skip: '▶ para continuar ya', cdAgainInf: '¡Su turno! La frase se repetirá…', cdAgain: '¡Su turno! Repetición {n}/{m}…',
      cdNext: '¡Su turno! Seguimos en un momento…', cdLoop: 'Fin de la secuencia — volvemos al inicio…',
      start: 'Inicio', startTitle: 'Volver al inicio (o al marcador A si el bucle está activo)', prevTitle: 'Frase anterior (←)',
      nextTitle: 'Frase siguiente (→)', play: 'Reproducir', pause: 'Pausa', spaceKey: 'Espacio', phrase: 'Frase', replayTitle: 'Repetir la frase (R)',

      delay: 'Pausa', repeatEach: 'Repetir cada frase', reps0: '0 veces (solo pausa)', reps1: '1 vez', repsN: '{n} veces', repsInf: 'en bucle',
      hintRepeat: 'Al final de cada subtítulo el vídeo se detiene durante el tiempo elegido (para repetir en voz alta) y luego repite la frase o pasa a la siguiente.',
      hAB: 'Secuencia A-B', abPause: 'Pausa antes de volver a empezar', snap: 'Ajustar A / B al inicio / final de las frases',
      hDisplay: 'Visualización', subsShown: 'Subtítulos mostrados', showBoth: 'Los dos', showTarget: '{lang} (idioma que aprendo)', showNative: '{lang} (mi idioma)',
      overlay: 'Subtítulos sobre el vídeo', mask: 'Ocultar el texto incrustado en la imagen', maskTop: 'Borde superior de la banda', maskBot: 'Borde inferior de la banda',
      maskHint: 'El texto incrustado forma parte de la imagen: queda cubierto por una banda oscura. Ajuste el borde superior e inferior de la banda (en % de la altura del vídeo).',
      speed: 'Velocidad', volume: 'Volumen', transcript: 'Transcripción', nPhrases: '{n} frases', noSubs: 'No hay subtítulos cargados.',
      mkA: 'Inicio de secuencia aquí', mkB: 'Fin de secuencia aquí',
      errFiles: 'No se ha reconocido ningún vídeo ni subtítulo en la selección.', errRead: 'No hay subtítulos legibles en {name}',
      errRead2: 'No hay subtítulos legibles.', errLoad: 'No se han podido cargar los subtítulos de este vídeo.',
      libNone: 'Todavía no hay vídeos en {lang} en la biblioteca.',
      keys: '<b>Espacio</b> reproducir/pausa · <b>Inicio</b> volver al principio · <b>←</b>/<b>→</b> frase anterior/siguiente · <b>R</b> repetir la frase · <b>[</b> / <b>]</b> poner A / B · <b>L</b> bucle A-B · <b>P</b> pausa tras cada frase · <b>1</b>…<b>5</b> pausa · <b>S</b> ajustes',
    },
  };
  function t(key, vars){
    let s = (I18N[ui] && I18N[ui][key]) ?? I18N.fr[key] ?? key;
    if(vars) s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k]);
    return s;
  }
  const langName = code => (LANG_NAMES[ui] || LANG_NAMES.fr)[code] || code;

  function applyI18n(){
    document.documentElement.lang = ui;
    document.title = t('title');
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
    document.querySelectorAll('[data-th]').forEach(e => { e.innerHTML = t(e.dataset.th); });
    document.querySelectorAll('[data-tt]').forEach(e => { e.title = t(e.dataset.tt); });
    document.querySelectorAll('[data-ta]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.ta)); });
    [...$('oReps').options].forEach(o => {
      o.textContent = o.value === 'inf' ? t('repsInf') : o.value === '0' ? t('reps0') : o.value === '1' ? t('reps1') : t('repsN', {n: o.value});
    });
    const p = PROFILES[profile];
    $('oShow').options[0].textContent = t('showBoth');
    $('oShow').options[1].textContent = t('showTarget', {lang: cap(langName(p.target))});
    $('oShow').options[2].textContent = t('showNative', {lang: cap(langName(p.native))});
    $('emptyMsg').innerHTML = catalog.length ? t('emptyLib') : t('emptyFiles');
    $('cueCount').textContent = cues.length ? t('nPhrases', {n: cues.length}) : '';
    if(!cues.length) $('trList').innerHTML = `<li class="tr-empty">${t('noSubs')}</li>`;
    buildTranscript();
    lastText = null; lastPlayState = null;
  }
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  let cues = [], cues2 = [];   // cues : piste principale (sert au minutage) ; cues2 : 2e langue affichée
  let tracks = {};             // langue -> sous-titres ('x' = fichier ouvert à la main)
  const lib = { videos: [], subs: [], current: -1 };
  const st = {
    A: null, B: null, loop: false,
    phrase: false, delay: 3, reps: Infinity, abPause: true, snap: true,
    tracked: -1, done: -1, playCount: 0,
    waiting: false, timer: null, waitStart: 0, waitMs: 0, pending: null, waitCue: -1,
  };

  /* ---------- Préférences ---------- */
  const PREF = 'lecteur-srt-prefs';
  function savePrefs(){
    try{ localStorage.setItem(PREF, JSON.stringify({phrase:st.phrase, delay:st.delay, reps:$('oReps').value,
      abPause:st.abPause, snap:st.snap, show:$('oShow').value, overlay:$('oOverlay').checked, mask:$('oMask').checked,
      maskTop:$('oMaskTop').value, maskBot:$('oMaskBot').value, rate:$('oRate').value, vol:$('oVol').value})); }catch(e){}
  }
  function loadPrefs(){
    let p = null; try{ p = JSON.parse(localStorage.getItem(PREF)); }catch(e){}
    if(!p) return;
    if('phrase' in p) $('oPhrase').checked = !!p.phrase;
    if(p.delay) $('oDelay').value = p.delay;
    if(p.reps != null) $('oReps').value = p.reps;
    if('abPause' in p) $('oAbPause').checked = !!p.abPause;
    if('snap' in p) $('oSnap').checked = !!p.snap;
    if(p.show) $('oShow').value = p.show;
    if('overlay' in p) $('oOverlay').checked = !!p.overlay;
    if('mask' in p) $('oMask').checked = !!p.mask;
    if(p.maskTop) $('oMaskTop').value = p.maskTop;
    if(p.maskBot) $('oMaskBot').value = p.maskBot;
    if(p.rate) $('oRate').value = p.rate;
    if(p.vol != null) $('oVol').value = p.vol;
  }
  function readOpts(){
    st.phrase = $('oPhrase').checked;
    st.delay = +$('oDelay').value;
    $('vDelay').textContent = (ui === 'en' ? String(st.delay) : String(st.delay).replace('.', ',')) + ' s';
    const r = $('oReps').value; st.reps = r === 'inf' ? Infinity : +r;
    st.abPause = $('oAbPause').checked;
    st.snap = $('oSnap').checked;
    $('overlay').style.display = $('oOverlay').checked ? '' : 'none';
    let top = +$('oMaskTop').value, bot = +$('oMaskBot').value;
    if(bot < top + 3){ bot = Math.min(100, top + 3); $('oMaskBot').value = bot; }
    $('vMaskTop').textContent = top + ' %'; $('vMaskBot').textContent = bot + ' %';
    const m = $('mask');
    m.hidden = !$('oMask').checked;
    m.style.top = top + '%'; m.style.height = (bot - top) + '%';
    $('maskRows').hidden = !$('oMask').checked;
    video.playbackRate = +$('oRate').value;
    if(!isIOS) video.volume = +$('oVol').value;
    savePrefs();
  }
  ['oPhrase','oDelay','oReps','oAbPause','oSnap','oOverlay','oMask','oMaskTop','oMaskBot','oRate','oVol'].forEach(id =>
    $(id).addEventListener('input', () => { readOpts(); if(id === 'oPhrase') resetTracking(); }));
  $('oShow').addEventListener('input', () => { savePrefs(); applyTracks(); });
  if(isIOS) $('volRow').hidden = true; // sur iPhone / iPad le volume se règle avec les boutons de l'appareil

  /* ---------- Panneau réglages ---------- */
  function setDrawer(open){
    app.classList.toggle('open', open);
    $('bSettings').classList.toggle('on', open);
  }
  $('bSettings').onclick = () => setDrawer(!app.classList.contains('open'));
  $('bClose').onclick = () => setDrawer(false);
  $('backdrop').onclick = () => setDrawer(false);

  /* ---------- Fichiers ---------- */
  const SUB_RE = /\.(srt|vtt)$/i, VID_RE = /\.(mp4|m4v|mov|webm|mkv)$/i;
  const isSub = f => SUB_RE.test(f.name);
  const isVid = f => VID_RE.test(f.name) || (f.type || '').startsWith('video/');
  const stem = n => n.replace(/\.[^.]+$/, '');
  const norm = s => s.normalize('NFC').toLowerCase().trim();
  const natSort = (a, b) => a.name.localeCompare(b.name, 'fr', {numeric: true, sensitivity: 'base'});

  // Langue d'un .srt d'après la fin de son nom (« .fr », « _VF », « Spanish »…)
  function langOf(extra){
    for(const w of norm(extra).split(/[^a-zàâçéèêëîïôûùüÿñ]+/).filter(Boolean)){
      if(['fr','fre','fra','french','francais','français','vf','vff','vostfr'].includes(w)) return 'fr';
      if(['en','eng','english','anglais','ingles','inglés'].includes(w)) return 'en';
      if(['es','spa','esp','spanish','espanol','español','espagnol'].includes(w)) return 'es';
    }
    return null;
  }

  // Le nom du .srt doit commencer par le nom de la vidéo ; les caractères en plus à la fin sont ignorés.
  // Priorité : la langue apprise, puis la langue de l'utilisatrice, puis sans langue.
  function findSubsFor(videoName){
    const b = norm(stem(videoName));
    const others = lib.videos.map(v => norm(stem(v.name))).filter(o => o.length > b.length && o.startsWith(b));
    const cands = lib.subs
      .map(f => ({f, s: norm(stem(f.name))}))
      .filter(x => x.s.startsWith(b))
      .filter(x => !others.some(o => x.s.startsWith(o)));
    if(!cands.length) return null;
    const p = PROFILES[profile];
    const rank = x => {
      const l = langOf(x.s.slice(b.length));
      return l === p.target ? 0 : l === p.native ? 1 : !l ? 2 : 3;
    };
    cands.sort((x, y) => rank(x) - rank(y) || x.s.length - y.s.length);
    return cands[0].f;
  }
  function addSubs(list){
    for(const f of list){
      const i = lib.subs.findIndex(s => s.name === f.name);
      if(i >= 0) lib.subs[i] = f; else lib.subs.push(f);
    }
  }
  let pendingSub = null; // sous-titre choisi avant la vidéo
  function handleFiles(fileList){
    const files = Array.from(fileList || []);
    const vids = files.filter(f => !isSub(f) && isVid(f)).sort(natSort);
    const subs = files.filter(isSub);
    addSubs(subs);
    if(vids.length){
      if(subs.length) pendingSub = subs[0];
      lib.videos = vids;
      buildPlaylist();
      openVideo(0);
    } else if(subs.length){
      const v = lib.videos[lib.current];
      const match = v && findSubsFor(v.name);
      if(!v) pendingSub = subs[0];
      loadSubs(match && subs.includes(match) ? match : subs[0]);
    } else if(files.length){
      setStatus(null, t('errFiles'));
    }
  }
  function buildPlaylist(){
    const sel = $('playlist');
    sel.innerHTML = '';
    lib.videos.forEach((f, i) => { const o = document.createElement('option'); o.value = i; o.textContent = stem(f.name); sel.appendChild(o); });
    sel.hidden = lib.videos.length < 2;
  }
  $('playlist').addEventListener('change', e => openVideo(+e.target.value));

  function openVideo(i){
    const f = lib.videos[i]; if(!f) return;
    lib.current = i; $('playlist').value = i; $('library').value = ''; fromLibrary = false;
    if(video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);
    video.src = URL.createObjectURL(f);
    stage.classList.remove('empty');
    clearAB(); resetTracking(); cancelWait(true);
    curTitle = stem(f.name);
    const sub = findSubsFor(f.name) || pendingSub;
    pendingSub = null;
    if(sub) loadSubs(sub);
    else { tracks = {}; applyTracks(); setStatus(curTitle); }
  }
  function decodeText(buf){
    try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
    catch(e){ return new TextDecoder('windows-1252').decode(buf); }
  }
  async function loadSubs(file){
    tracks = {x: parseSubs(decodeText(await file.arrayBuffer()))};
    applyTracks();
    setStatus(curTitle, cues.length ? null : t('errRead', {name: file.name}));
  }

  // Choisit la piste principale et la 2e langue selon « Sous-titres affichés »
  function applyTracks(){
    const p = PROFILES[profile], mode = $('oShow').value;
    const T = tracks[p.target], N = tracks[p.native];
    let main = null, second = null;
    if(tracks.x) main = tracks.x;
    else if(mode === 'target') main = T || N;
    else if(mode === 'native') main = N || T;
    else { main = T || N; second = T && N ? N : null; }
    if(!main) main = Object.values(tracks)[0] || [];
    cues = main; cues2 = second || [];
    buildTranscript(); drawCues(); resetTracking(); lastText = null;
    if(curTitle || video.getAttribute('src')) setStatus(curTitle);
  }

  let curTitle = '';
  function setStatus(title, warn){
    const s = $('status'); s.innerHTML = '';
    const add = (txt, cls) => { const e = document.createElement('span'); e.textContent = txt; e.title = txt; if(cls) e.className = cls; s.appendChild(e); };
    // le titre n'est pas répété quand une liste (bibliothèque ou plusieurs vidéos) l'affiche déjà
    if(title && lib.videos.length < 2 && $('library').value === '') add(title, 'title');
    if(warn) add('⚠️ ' + warn, 'warn');
    // tant qu'une vidéo est ouverte sans sous-titres, le bouton « Sous-titres » clignote
    $('lblSrt').classList.toggle('blink', !!video.getAttribute('src') && !cues.length && !loadingSubs);
  }

  /* ---------- Bibliothèque publiée avec le site (media-library) ----------
     Remplie par ajouter-enlever-videos\gerer-bibliotheque.cmd : chaque vidéo y est rangée avec ses .srt
     (un par langue). Chaque profil voit les vidéos dans la langue qu'il apprend. */
  let allPieces = [], catalog = [], loadingSubs = false, fromLibrary = false;
  const LAST = 'lecteur-srt-dernier';
  const libUrl = p => 'media-library/' + p.split('/').map(encodeURIComponent).join('/');
  function loadScript(src){
    return new Promise(res => {
      const s = document.createElement('script');
      s.src = src; s.onload = () => res(true); s.onerror = () => res(false);
      document.head.appendChild(s);
    });
  }
  // sous-titres d'une vidéo : {langue: {path, text}}
  function subsOf(p){
    let s = p.subtitles, tx = p.subtitlesText;
    if(typeof s === 'string'){
      const vs = norm(stem(p.video.split('/').pop())), ss = norm(stem(s.split('/').pop()));
      const l = langOf(ss.startsWith(vs) ? ss.slice(vs.length) : ss) || 'fr';
      s = {[l]: s}; if(typeof tx === 'string') tx = {[l]: tx};
    }
    const out = {};
    for(const [l, path] of Object.entries(s || {})) out[l] = {path, text: tx && tx[l]};
    return out;
  }
  async function loadCatalog(){
    // catalog.js (avec le texte des .srt) fonctionne aussi quand la page est ouverte par double-clic ;
    // catalog.json sert de secours sur un serveur.
    let data = null;
    if(await loadScript('media-library/catalog.js?v=' + Date.now()) && window.MEDIA_LIBRARY) data = window.MEDIA_LIBRARY;
    else {
      try { const r = await fetch('media-library/catalog.json', {cache: 'no-cache'}); if(r.ok) data = await r.json(); } catch(e){}
    }
    allPieces = data ? (data.pieces || []).filter(p => p && p.video && p.title) : [];
    buildLibrary(true);
  }
  function buildLibrary(autoOpen){
    const target = PROFILES[profile].target;
    catalog = allPieces.filter(p => !p.lang || p.lang === target)
      .sort((a, b) => a.title.localeCompare(b.title, ui, {numeric: true, sensitivity: 'base'}));
    const sel = $('library');
    sel.length = 1;
    catalog.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.title; sel.appendChild(o); });
    sel.hidden = !catalog.length;
    $('emptyMsg').innerHTML = catalog.length ? t('emptyLib') : t('emptyFiles');
    if(!catalog.length){
      if(fromLibrary){ // la vidéo affichée venait de la bibliothèque d'un autre profil : on la retire
        fromLibrary = false; curTitle = '';
        video.removeAttribute('src'); video.load();
        stage.classList.add('empty'); clearAB(); resetTracking(); cancelWait(true);
        tracks = {}; applyTracks();
      }
      if(allPieces.length && !video.getAttribute('src')) setStatus(null, t('libNone', {lang: langName(target)}));
      return;
    }
    // au démarrage : la dernière vidéo regardée avec ce profil, sinon la première de la liste
    let last = null; try { last = localStorage.getItem(LAST + '-' + profile); } catch(e){}
    const i = catalog.findIndex(p => p.id === last);
    if(autoOpen) openPiece(i >= 0 ? i : 0);
  }
  async function openPiece(i){
    const p = catalog[i]; if(!p) return;
    $('library').value = i; fromLibrary = true;
    lib.videos = []; lib.current = -1; pendingSub = null; buildPlaylist();
    if(video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);
    video.src = libUrl(p.video);
    stage.classList.remove('empty');
    clearAB(); resetTracking(); cancelWait(true);
    curTitle = p.title;
    tracks = {}; applyTracks();
    try { localStorage.setItem(LAST + '-' + profile, p.id); } catch(e){}
    const subs = subsOf(p);
    if(!Object.keys(subs).length){ setStatus(curTitle); return; }
    loadingSubs = true; setStatus(curTitle);
    try {
      const loaded = {};
      for(const [l, s] of Object.entries(subs)){
        let text = s.text;
        if(text == null){
          const r = await fetch(libUrl(s.path));
          if(!r.ok) throw new Error(r.status);
          text = decodeText(await r.arrayBuffer());
        }
        loaded[l] = parseSubs(text);
      }
      if($('library').value !== String(i)) return; // une autre vidéo a été choisie entre-temps
      loadingSubs = false;
      tracks = loaded; applyTracks();
      setStatus(curTitle, cues.length ? null : t('errRead2'));
    } catch(e){
      loadingSubs = false;
      setStatus(curTitle, t('errLoad'));
    }
  }
  $('library').addEventListener('change', e => { if(e.target.value !== '') openPiece(+e.target.value); });

  // Deux boutons séparés : Vidéo et Sous-titres
  if(!isIOS) $('fSrt').accept = '.srt,.vtt'; // sur iPhone / iPad, un filtre .srt peut griser les fichiers
  ['fVideo', 'fSrt'].forEach(id => $(id).addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; }));

  // Glisser-déposer (ordinateur) : vidéo et/ou .srt
  ['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); stage.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if(ev === 'drop' || !e.relatedTarget) stage.classList.remove('drag'); }));
  document.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

  /* ---------- Lecture du SRT ---------- */
  function parseTime(s){
    const m = s.match(/(?:(\d+):)?(\d{1,2}):(\d{1,2})[,.](\d{1,3})/);
    if(!m) return NaN;
    return (+(m[1]||0))*3600 + (+m[2])*60 + (+m[3]) + (+m[4].padEnd(3,'0'))/1000;
  }
  function parseSubs(txt){
    txt = txt.replace(/^﻿/, '').replace(/\r\n?/g, '\n').split('\n').map(l => l.trimEnd()).join('\n');
    const out = [];
    for(const block of txt.split(/\n{2,}/)){
      const lines = block.split('\n');
      const i = lines.findIndex(l => l.includes('-->'));
      if(i < 0) continue;
      const [a, b] = lines[i].split('-->');
      const start = parseTime(a), end = parseTime(b || '');
      if(isNaN(start) || isNaN(end)) continue;
      const text = lines.slice(i+1).join('\n')
        .replace(/\{\\[^}]*\}/g, '').replace(/<\/?[a-z][^>]*>/gi, '').trim();
      if(!text) continue;
      out.push({start, end: Math.max(end, start + 0.1), text});
    }
    out.sort((x, y) => x.start - y.start);
    return out;
  }
  function lastStartBefore(t, list = cues){
    let lo = 0, hi = list.length - 1, ans = -1;
    while(lo <= hi){ const m = (lo + hi) >> 1; if(list[m].start <= t + 0.001){ ans = m; lo = m + 1; } else hi = m - 1; }
    return ans;
  }
  function cueAt(t, list = cues){ const i = lastStartBefore(t, list); return (i >= 0 && t < list[i].end) ? i : -1; }
  // texte de la 2e langue pendant une phrase de la piste principale
  function secondText(c){
    if(!cues2.length) return '';
    const mid = (c.start + c.end) / 2;
    let j = cueAt(mid, cues2);
    if(j < 0){ j = lastStartBefore(mid, cues2); if(j < 0 || cues2[j].end < c.start) return ''; }
    return cues2[j].text;
  }

  /* ---------- Lecture / attente ---------- */
  const dur = () => isFinite(video.duration) ? video.duration : 0;
  const validAB = () => st.A != null && st.B != null && st.B > st.A;
  function resume(){ const p = video.play(); if(p) p.catch(() => {}); }
  function resetTracking(){ st.tracked = -1; st.done = -1; st.playCount = 0; }
  function userSeek(t){
    cancelWait(true);
    video.currentTime = Math.max(0, Math.min(t, dur() || t));
    resetTracking();
  }
  function startWait(sec, label, fn, cueIdx = -1){
    video.pause();
    st.waiting = true; st.waitStart = performance.now(); st.waitMs = sec * 1000;
    st.pending = fn; st.waitCue = cueIdx;
    $('cdLabel').textContent = label;
    $('countdown').classList.add('on');
    clearTimeout(st.timer);
    st.timer = setTimeout(runPending, st.waitMs);
  }
  function runPending(){ const fn = st.pending; cancelWait(true); if(fn) fn(); }
  // full=true : on oublie l'action en attente ; false : ▶ la reprendra
  function cancelWait(full){
    clearTimeout(st.timer); st.waiting = false;
    $('countdown').classList.remove('on');
    if(full){ st.pending = null; st.waitCue = -1; }
  }
  function play(){
    if(st.pending){ runPending(); return; }
    const t = video.currentTime;
    if(st.loop && validAB() && (t < st.A - 0.05 || t >= st.B - 0.05)) userSeek(st.A);
    else if(video.ended) userSeek(0);
    resume();
  }
  function pause(){ if(st.waiting){ cancelWait(false); return; } video.pause(); }
  const isRunning = () => st.waiting || !video.paused;
  function togglePlay(){ if(!video.src) return; isRunning() ? pause() : play(); }

  function loopBack(){
    const go = () => { video.currentTime = st.A; resetTracking(); resume(); };
    if(st.abPause) startWait(st.delay, t('cdLoop'), go);
    else go();
  }
  function check(){
    if(video.paused || st.waiting || !video.src) return;
    const time = video.currentTime;
    if(st.loop && validAB() && (time >= st.B - 0.03 || video.ended)){ loopBack(); return; }
    if(st.phrase && cues.length){
      if(st.tracked >= 0){
        const c = cues[st.tracked];
        if(time >= c.end - 0.03){
          const ci = st.tracked;
          st.playCount++;
          const again = st.playCount <= st.reps;
          const label = again
            ? (st.reps === Infinity ? t('cdAgainInf') : t('cdAgain', {n: st.playCount, m: st.reps}))
            : t('cdNext');
          startWait(st.delay, label, () => {
            if(again){ video.currentTime = cues[ci].start; st.tracked = ci; st.done = -1; }
            else { st.tracked = -1; st.done = ci; st.playCount = 0; }
            resume();
          }, ci);
          return;
        }
      }
      const i = cueAt(time);
      if(i >= 0 && i !== st.tracked && i !== st.done){ st.tracked = i; st.playCount = 0; }
    }
  }
  video.addEventListener('timeupdate', check);
  video.addEventListener('ended', () => { if(st.loop && validAB()) loopBack(); });

  /* ---------- Navigation phrases ---------- */
  function gotoCue(i, autoplay = true){
    if(i < 0 || i >= cues.length) return;
    userSeek(cues[i].start + 0.001);
    if(autoplay) resume();
  }
  function prevCue(){
    if(!cues.length) return userSeek(video.currentTime - 5);
    const time = video.currentTime, i = lastStartBefore(time);
    if(i >= 0 && time - cues[i].start > 0.8) gotoCue(i, isRunning());
    else gotoCue(Math.max(0, i - 1), isRunning());
  }
  function nextCue(){
    if(!cues.length) return userSeek(video.currentTime + 5);
    gotoCue(Math.min(cues.length - 1, lastStartBefore(video.currentTime) + 1), isRunning());
  }
  function replayCue(){
    if(!cues.length) return;
    const time = st.waitCue >= 0 ? cues[st.waitCue].start : video.currentTime;
    gotoCue(Math.max(0, lastStartBefore(time)), true);
  }
  function goStart(){
    const r = isRunning();
    userSeek(st.loop && validAB() ? st.A : 0);
    if(r) resume();
  }

  /* ---------- Marqueurs A / B ---------- */
  function snapA(time){ if(!st.snap || !cues.length) return time; const i = cueAt(time); return i >= 0 ? cues[i].start : time; }
  function snapB(time){
    if(!st.snap || !cues.length) return time;
    const i = cueAt(time); if(i >= 0) return cues[i].end;
    const j = lastStartBefore(time); return (j >= 0 && time - cues[j].end < 1.5) ? cues[j].end : time;
  }
  function setMarker(which, time){
    const d = dur(); if(!d) return;
    time = Math.max(0, Math.min(d, time));
    if(which === 'A'){ st.A = time; if(st.B != null && st.B <= st.A + 0.2) st.B = null; }
    else { st.B = time; if(st.A != null && st.A >= st.B - 0.2) st.A = null; }
    if(!validAB() && st.loop) setLoop(false);
    updateAB();
  }
  function setLoop(on){
    if(on && !validAB()){
      if(!cues.length) return;
      const i = Math.max(0, lastStartBefore(video.currentTime));
      st.A = cues[i].start; st.B = cues[i].end; // pas de séquence : la phrase en cours
    }
    st.loop = on;
    if(on){
      const time = video.currentTime;
      if(time < st.A - 0.05 || time >= st.B){ const r = isRunning(); userSeek(st.A); if(r) resume(); }
    }
    updateAB();
  }
  function clearAB(){ st.A = st.B = null; st.loop = false; updateAB(); }
  function updateAB(){
    const d = dur();
    const pos = x => d ? (x / d * 100) + '%' : '0';
    $('mA').classList.toggle('on', st.A != null); if(st.A != null) $('mA').style.left = pos(st.A);
    $('mB').classList.toggle('on', st.B != null); if(st.B != null) $('mB').style.left = pos(st.B);
    const reg = $('region');
    reg.classList.toggle('on', validAB()); reg.classList.toggle('loop', st.loop);
    if(validAB()){ reg.style.left = pos(st.A); reg.style.width = ((st.B - st.A) / d * 100) + '%'; }
    $('bLoop').classList.toggle('on', st.loop);
    $('abInfo').textContent = (st.A != null || st.B != null)
      ? `A ${st.A != null ? fmt(st.A) : '—'} → B ${st.B != null ? fmt(st.B) : '—'}${validAB() ? '  (' + (st.B - st.A).toFixed(1) + ' s)' : ''}`
      : '';
    trItems.forEach((li, i) => li.classList.toggle('inab', validAB() && cues[i].start >= st.A - 0.01 && cues[i].end <= st.B + 0.01));
  }

  /* ---------- Barre de temps (souris et doigt) ---------- */
  function timeFromX(x){ const r = track.getBoundingClientRect(); return Math.min(1, Math.max(0, (x - r.left) / r.width)) * dur(); }
  function snapDrag(time, which){
    if(!st.snap || !cues.length) return time;
    const tol = 12 / track.clientWidth * dur();
    let best = time, bd = tol;
    for(const c of cues){ const v = which === 'A' ? c.start : c.end; const dd = Math.abs(v - time); if(dd < bd){ bd = dd; best = v; } }
    return best;
  }
  let drag = null, dragWasRunning = false;
  track.addEventListener('pointerdown', e => {
    if(!dur()) return;
    const m = e.target.closest('.marker');
    drag = m ? m.dataset.m : 'seek';
    try { track.setPointerCapture(e.pointerId); } catch(_){}
    if(drag === 'seek'){ dragWasRunning = isRunning(); if(!video.paused) video.pause(); userSeek(timeFromX(e.clientX)); }
    e.preventDefault();
  });
  track.addEventListener('pointermove', e => {
    const tip = $('tip');
    if(dur() && (e.pointerType === 'mouse' || drag)){
      const r = track.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = Math.min(r.width, Math.max(0, e.clientX - r.left)) + 'px';
      tip.textContent = fmt(timeFromX(e.clientX));
    }
    if(!drag) return;
    const time = timeFromX(e.clientX);
    if(drag === 'seek') userSeek(time);
    else setMarker(drag, snapDrag(time, drag));
  });
  const endDrag = e => {
    if(drag === 'seek' && dragWasRunning) resume();
    drag = null;
    if(!e || e.pointerType !== 'mouse') $('tip').style.display = 'none';
  };
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
  track.addEventListener('pointerleave', () => { if(!drag) $('tip').style.display = 'none'; });

  function drawCues(){
    const cv = $('cueCanvas'), dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.max(1, w * dpr); cv.height = Math.max(1, h * dpr);
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const d = dur(); if(!d || !cues.length) return;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--cue').trim() || '#5b6372';
    for(const c of cues){ ctx.fillRect(c.start / d * w, 0, Math.max(1, (c.end - c.start) / d * w - 1), h); }
  }
  if('ResizeObserver' in window) new ResizeObserver(drawCues).observe(track);
  else window.addEventListener('resize', drawCues);
  video.addEventListener('loadedmetadata', () => { drawCues(); updateAB(); readOpts(); });

  /* ---------- Transcription (seule la phrase en cours est visible) ---------- */
  let trItems = [], activeIdx = -1;
  const list = $('trList');
  function buildTranscript(){
    list.innerHTML = ''; trItems = []; activeIdx = -1;
    $('cueCount').textContent = cues.length ? t('nPhrases', {n: cues.length}) : '';
    if(!cues.length){ list.innerHTML = `<li class="tr-empty">${t('noSubs')}</li>`; return; }
    const frag = document.createDocumentFragment();
    cues.forEach((c, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="t">${fmt(c.start, true)}</span><span class="x"></span>
        <span class="mk"><button class="ma">A</button><button class="mb">B</button></span>`;
      li.querySelector('.ma').title = t('mkA'); li.querySelector('.mb').title = t('mkB');
      const x = li.querySelector('.x');
      x.textContent = c.text;
      const s2 = secondText(c);
      if(s2){ const e = document.createElement('span'); e.className = 'x2'; e.textContent = s2; x.appendChild(e); }
      li.addEventListener('click', e => {
        if(e.target.closest('.ma')){ setMarker('A', c.start); return; }
        if(e.target.closest('.mb')){ setMarker('B', c.end); return; }
        gotoCue(i, true);
      });
      frag.appendChild(li); trItems.push(li);
    });
    list.appendChild(frag);
    updateAB();
  }
  function setActive(i){
    if(i === activeIdx) return;
    if(trItems[activeIdx]) trItems[activeIdx].classList.remove('active');
    activeIdx = i;
    if(trItems[i]) trItems[i].classList.add('active');
  }

  /* ---------- Affichage ---------- */
  function fmt(x, short){
    if(!isFinite(x) || x < 0) x = 0;
    const h = Math.floor(x / 3600), m = Math.floor(x % 3600 / 60), s = Math.floor(x % 60), ds = Math.floor(x * 10 % 10);
    const base = (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
    return short ? base : base + '.' + ds;
  }
  let lastText = null, lastPlayState = null;
  function render(){
    const time = video.currentTime, d = dur();
    $('tCur').textContent = fmt(time);
    $('tDur').textContent = fmt(d);
    const p = d ? time / d * 100 : 0;
    $('played').style.width = p + '%';
    $('playhead').style.left = p + '%';
    if(d && video.buffered.length){
      let be = 0;
      for(let i = 0; i < video.buffered.length; i++) if(video.buffered.start(i) <= time + 0.5) be = Math.max(be, video.buffered.end(i));
      $('buffered').style.width = (be / d * 100) + '%';
    }
    let i = cueAt(time);
    if(i < 0 && st.waitCue >= 0 && (st.waiting || st.pending)) i = st.waitCue;
    const text = i >= 0 ? cues[i].text : '';
    const text2 = i >= 0 ? secondText(cues[i]) : '';
    const key = text + '\u0001' + text2;
    if(key !== lastText){
      lastText = key;
      const ov = $('overlay'), cur = $('current');
      ov.innerHTML = ''; cur.innerHTML = '';
      if(text){
        const s = document.createElement('span'); s.textContent = text; ov.appendChild(s);
        cur.appendChild(document.createTextNode(text));
        if(text2){
          const s2 = document.createElement('span'); s2.className = 'sub2'; s2.textContent = text2; ov.appendChild(s2);
          const c2 = document.createElement('span'); c2.className = 'c2'; c2.textContent = text2; cur.appendChild(c2);
        }
      } else cur.innerHTML = `<span class="ph">${cues.length ? '…' : t('currentPh')}</span>`;
    }
    setActive(i >= 0 ? i : (cues.length ? lastStartBefore(time) : -1));
    if(st.waiting) $('cdBar').style.width = (Math.min(1, (performance.now() - st.waitStart) / st.waitMs) * 100) + '%';
    const running = isRunning();
    if(running !== lastPlayState){
      lastPlayState = running;
      $('playIcon').setAttribute('href', running ? '#i-pause' : '#i-play');
      $('playLbl').textContent = running ? t('pause') : t('play');
    }
  }
  function frame(){ check(); render(); requestAnimationFrame(frame); }

  /* ---------- Profil ---------- */
  const sel = $('oProfile');
  Object.entries(PROFILES).forEach(([k, p]) => { const o = document.createElement('option'); o.value = k; o.textContent = p.label; sel.appendChild(o); });
  function setProfile(k, save){
    if(!PROFILES[k]) return;
    const changed = k !== profile;
    profile = k; ui = PROFILES[k].native; sel.value = k;
    if(save){ try { localStorage.setItem(PROFILE_KEY, k); } catch(e){} }
    applyI18n(); readOpts();
    if(changed){
      buildLibrary(fromLibrary || !video.getAttribute('src'));
      if(!tracks.x) applyTracks();
    }
  }
  sel.addEventListener('change', () => setProfile(sel.value, true));
  function showChooser(){
    const box = $('chooserList'); box.innerHTML = '';
    Object.entries(PROFILES).forEach(([k, p]) => {
      const b = document.createElement('button'); b.className = 'btn'; b.textContent = p.label;
      b.onclick = () => { $('chooser').hidden = true; setProfile(k, true); };
      box.appendChild(b);
    });
    $('chooser').hidden = false;
  }

  /* ---------- Boutons & clavier ---------- */
  $('bPlay').onclick = togglePlay;
  $('bStart').onclick = goStart;
  $('bPrev').onclick = prevCue;
  $('bNext').onclick = nextCue;
  $('bReplay').onclick = replayCue;
  $('bA').onclick = () => setMarker('A', snapA(video.currentTime));
  $('bB').onclick = () => setMarker('B', snapB(video.currentTime));
  $('bLoop').onclick = () => setLoop(!st.loop);
  $('bClear').onclick = clearAB;
  video.addEventListener('click', togglePlay);

  document.addEventListener('keydown', e => {
    const tag = e.target.tagName;
    if(tag === 'SELECT' || (tag === 'INPUT' && e.target.type !== 'checkbox')) return;
    if(e.ctrlKey || e.metaKey || e.altKey || !$('chooser').hidden) return;
    const k = e.key;
    let handled = true;
    if(k === ' ' || k === 'k' || k === 'K') togglePlay();
    else if(k === 'Home' || k === '0') goStart();
    else if(k === 'ArrowLeft') prevCue();
    else if(k === 'ArrowRight') nextCue();
    else if(k === 'r' || k === 'R') replayCue();
    else if(k === '[') $('bA').click();
    else if(k === ']') $('bB').click();
    else if(k === 'l' || k === 'L') setLoop(!st.loop);
    else if(k === 'p' || k === 'P'){ $('oPhrase').checked = !$('oPhrase').checked; readOpts(); resetTracking(); }
    else if(k === 's' || k === 'S') setDrawer(!app.classList.contains('open'));
    else if(k === 'Escape') setDrawer(false);
    else if(k >= '1' && k <= '5'){ $('oDelay').value = k; readOpts(); }
    else handled = false;
    if(handled) e.preventDefault();
  });
  document.addEventListener('keyup', e => { if(e.key === ' ' && e.target.tagName === 'BUTTON') e.preventDefault(); });

  /* ---------- Démarrage ---------- */
  // Profil : lien direct (?p=en-fr), sinon le dernier choisi, sinon on le demande
  const fromUrl = new URLSearchParams(location.search).get('p');
  let saved = null; try { saved = localStorage.getItem(PROFILE_KEY); } catch(e){}
  const startProfile = PROFILES[fromUrl] ? fromUrl : PROFILES[saved] ? saved : null;
  profile = startProfile || 'fr-en'; ui = PROFILES[profile].native; sel.value = profile;
  if(fromUrl && PROFILES[fromUrl]){ try { localStorage.setItem(PROFILE_KEY, fromUrl); } catch(e){} }
  loadPrefs(); applyI18n(); readOpts(); updateAB(); loadCatalog();
  if(!startProfile) showChooser();
  requestAnimationFrame(frame);

  // Fonctionne hors ligne une fois installé (GitHub Pages / écran d'accueil)
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
